name: shopping_list
description: "Shopping List lets you create your shopping lists and store your loyalty cards, even without an internet connection. This allows you to use it anywhere, easily and quickly."
publish_to: 'none'
version: 1.3.7+13 # versionCode+versionName

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^2.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  go_router: ^18.1.2
  hydrated_bloc: ^11.0.0
  flutter_bloc: ^9.1.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  equatable: ^3.0.0
  barcode_widget: ^2.0.4
  share_plus: ^13.3.1
  file_picker: ^13.3.2
  pretty_qr_code: ^3.6.0
  flutter_colorpicker: ^1.1.0
  uuid: ^4.6.0
  url_launcher: ^6.3.3
  mobile_scanner: ^7.5.0
  sqflite: ^2.4.5
  path: ^1.9.1
  package_info_plus: ^10.2.2
  shadcn_ui: ^0.57.4
  intl: ^0.20.3
  screen_brightness: ^2.1.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  qr: ^3.0.2
  sqflite_common_ffi: ^2.4.5

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/OFL-BricolageGrotesque.txt
    - assets/fonts/OFL-Figtree.txt
  fonts:
    - family: Cookie
      fonts:
        - asset: assets/fonts/Cookie-Regular.ttf
    - family: Bricolage Grotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Medium.ttf
          weight: 500
        - asset: assets/fonts/BricolageGrotesque-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque-Bold.ttf
          weight: 700
        - asset: assets/fonts/BricolageGrotesque-ExtraBold.ttf
          weight: 800
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-Regular.ttf
        - asset: assets/fonts/Figtree-Medium.ttf
          weight: 500
        - asset: assets/fonts/Figtree-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Figtree-Bold.ttf
          weight: 700
